name: "Deploy to S3"
description: "Deploy a website to S3"
inputs:
  bucket:
    description: "The name of the S3 bucket to deploy to"
    required: true
  bucket-region:
    description: "The AWS region where the S3 bucket is located"
    required: false
    default: "us-east-1"
  dist-folder:
    description: "The folder containing the website files to deploy"
    required: true
outputs:
  website-url: # Will inject from main.js
    description: "The URL of the deployed website"

runs:
  using: "node16"
  main: "main.js"
